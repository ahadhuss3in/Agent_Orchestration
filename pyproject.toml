[project]
name = "ai-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "google-generativeai>=0.8.6",
    "langchain>=1.3.18",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.6",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "logfire[fastapi,requests]>=4.41.0",
    "loguru>=0.7.3",
    "mcp>=2.1.1",
    "numpy>=2.5.2",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "tavily-python>=0.8.1",
    "trafilatura>=2.2.0",
    "unstructured>=0.27.5",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# this tells pytest to add the project's root folder to python's search
# path, so a test file can do things like
# "from services.Rag.ingestion.loaders import text_loader"
# without any extra setup.
pythonpath = ["."]
